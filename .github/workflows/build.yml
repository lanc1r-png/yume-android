name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Yume-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Yume-debug
          path: Yume-debug.apk

      # Свежий APK всегда лежит в релизе «latest»: его можно скачать прямо с телефона.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Yume-debug.apk --prerelease \
            --title "Yume (последняя сборка)" \
            --notes "Автоматическая отладочная сборка: ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
